name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: debian:stable-slim
    steps:
      - name: install git and make
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git make tar
      - uses: actions/checkout@v4
      - name: install Neovim
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          tar -C /usr/local --strip-components=1 -xzf /tmp/nvim.tar.gz
          rm /tmp/nvim.tar.gz
          nvim --version
      - name: test
        run: make test
