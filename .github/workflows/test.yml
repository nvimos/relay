# The headless plugin tests (nvim -l test/run.lua) on Windows, where the GUI runs.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # The default %TEMP% is an 8.3 short path (C:\Users\RUNNER~1); git reports the long one, so
      # the tests' path comparisons fail. The runner's own temp dir has no short parts.
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: git identity for the test repos
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main
      - run: nvim --version
      - run: nvim -l test/run.lua
